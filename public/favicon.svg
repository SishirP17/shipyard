<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- badge: website-colored fill + thick white ring -->
  <circle cx="32" cy="32" r="28" fill="#06070d" stroke="#ffffff" stroke-width="4"/>

  <g stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- rigging stays (behind sails) -->
    <g fill="none" stroke-width="0.8" opacity="0.65">
      <path d="M32 11 L15 41"/>
      <path d="M32 11 L49 41"/>
    </g>

    <!-- mast -->
    <line x1="32" y1="9" x2="32" y2="43" stroke-width="1.5"/>

    <!-- pennant flag -->
    <path d="M32 9 L42 11.5 L32 14 Z" fill="#ffffff" stroke-width="0.5"/>

    <!-- top sail (billowing) -->
    <path d="M24 16 Q32 18 40 16 L42.5 23 Q32 26.5 21.5 23 Z" fill="#ffffff" stroke-width="0.8"/>
    <!-- main sail (big, wind-filled) -->
    <path d="M17 25 Q32 28 47 25 L50 38 Q32 44.5 14 38 Z" fill="#ffffff" stroke-width="0.8"/>

    <!-- sail seams for depth -->
    <g fill="none" stroke="#06070d" stroke-width="0.9" opacity="0.85">
      <path d="M22.5 19.5 Q32 21.4 41.5 19.5"/>
      <path d="M16.5 29.5 Q32 32.4 47.5 29.5"/>
      <path d="M15.5 33.8 Q32 37 48.5 33.8"/>
    </g>

    <!-- bowsprit + tiny jib at the bow -->
    <line x1="48" y1="42" x2="56" y2="38" stroke-width="1"/>
    <path d="M50 40.5 L55 38.7 L50.5 43 Z" fill="#ffffff" stroke-width="0.5"/>

    <!-- hull with raised stern castle -->
    <path d="M11 41 L11 34.5 Q11 33 13 33 L17.5 33 L17.5 41
             L53 41 Q51 48.5 45.5 51.5 L18.5 51.5 Q13 48.5 11 41 Z"
          fill="#ffffff" stroke-width="0.8"/>
    <!-- hull plank line -->
    <path d="M13 45 L50 45" fill="none" stroke="#06070d" stroke-width="0.9" opacity="0.8"/>
  </g>

  <!-- sea -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity="0.9">
    <path d="M15 52.5 q3 -2.4 6 0 t6 0 t6 0 t6 0 t6 0" stroke-width="1.4"/>
    <path d="M20 56 q3 -2.2 6 0 t6 0 t6 0" stroke-width="1.2" opacity="0.7"/>
  </g>
</svg>
