      <rect x="504" y="222" width="16" height="48" rx="8"/>
      <rect x="504" y="754" width="16" height="48" rx="8"/>
      <rect x="754" y="504" width="48" height="16" rx="8"/>
      <rect x="222" y="504" width="48" height="16" rx="8"/>
    </g>

    <polygon points="512,290 556,512 468,512" fill="url(#north)"/>
    <polygon points="512,734 556,512 468,512" fill="url(#south)"/>

    <circle cx="512" cy="512" r="38" fill="#0B1220"/>
