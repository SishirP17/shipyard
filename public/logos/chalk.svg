<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142"/>
      <stop offset="100%" stop-color="#1B1E29"/>
    </linearGradient>
    <linearGradient id="chalkBody2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="chalkTip2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#boardGrad2)"/>

  <!-- Chalk tray -->
  <rect x="80" y="410" width="352" height="20" rx="10" fill="#4A4E5C"/>

  <!-- Drawn trail -->
  <path d="M120 330 C 170 280, 210 255, 250 225"
        fill="none"
        stroke="#9CA3AF"
        stroke-width="9"
        stroke-linecap="round"
        stroke-dasharray="2 30"/>

  <!-- Chalk stick, angled -->
  <g transform="translate(225, 90) rotate(40)">
    <rect x="0" y="0" width="78" height="225" rx="20" fill="url(#chalkBody2)" stroke="#D1D5DB" stroke-width="4"/>
    <path d="M0 225 L78 225 L60 272 Q39 294 18 272 Z" fill="url(#chalkTip2)" stroke="#D1D5DB" stroke-width="4"/>
    <line x1="18" y1="34" x2="18" y2="190" stroke="#D1D5DB" stroke-width="3" opacity="0.6"/>
    <line x1="60" y1="34" x2="60" y2="190" stroke="#D1D5DB" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Chalk dust -->
  <circle cx="250" cy="255" r="10" fill="#E5E7EB" opacity="0.9"/>
  <circle cx="270" cy="275" r="7" fill="#E5E7EB" opacity="0.6"/>
  <circle cx="225" cy="280" r="5.5" fill="#E5E7EB" opacity="0.7"/>
</svg>
